# MetricMind Web 容器：静态托管 SPA + 反代 /api。
#
# 两个容易踩的点：
# - /api/runs/{id}/stream 是 SSE，必须 proxy_buffering off，否则事件会卡在
#   Nginx 缓冲里，前端只能看到运行结束后一次性吐出的内容。
# - 前端用 createBrowserRouter，/workspace/... 这类深链接必须回退到 index.html。

worker_processes auto;

# 这个文件替换的是完整 nginx.conf（不是 conf.d 片段），因此可以写 main 上下文指令。
user nginx;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    upstream metricmind_api {
        # 与 compose 服务名一致；单实例部署，不需要负载均衡策略。
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 后端限制 25MB，多留一点给 multipart 边界与头部。
        client_max_body_size 32m;

        # 容器健康检查专用，不写访问日志。
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 后端 API（含 SSE 与文件下载）。
        location /api/ {
            proxy_pass http://metricmind_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE：关缓冲、禁缓存、放宽长连接超时（run 超时上限 240s + 心跳）。
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Vite 产物带内容哈希，可以长缓存；index.html 绝不能缓存，
        # 否则重新构建后浏览器还指向旧的 assets 文件名。
        location /assets/ {
            # 只用一条 Cache-Control，避免 expires 与 add_header 叠加出重复响应头。
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # 其余路径交给前端路由；不存在的静态文件也回退到 SPA。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
